# TRANSITIONAL. Central self-hosted Renovate runner for the repos that haven't adopted the
# per-repo model yet. Each managed repo now runs Renovate itself: its copier-placed
# .github/workflows/renovate.yml calls reusable-renovate.yml in this repo at a tag. This runner
# skips every repo whose renovate.yml already does that (see "Skip repos that run Renovate
# themselves"), so a repo always has exactly one Renovate. Delete this file and
# .github/renovate-global.json once every repo has adopted.
#
# Central self-hosted Renovate runner for the managed-repo fleet. This control-plane repo runs
# Renovate on a schedule, authenticated as its own dedicated Renovate GitHub App, and opens dependency PRs across
# every managed repo — replacing reliance on the Mend hosted Renovate app. Running it ourselves
# unlocks `postUpgradeTasks` (the hosted app forbids them), which lets a bumped binary's
# *_SHA256 be refreshed inside Renovate's OWN commit (see allowedCommands below + nivintw/
# copier-everything#88, which this unblocks). The supply-chain tamper gate on that refresh is
# armed fleet-wide via `customEnvVariables.BASE_REF` in renovate-global.json (see that file) —
# without it the postUpgradeTask would run the script bare and silently re-pin a swapped asset.
#
# AUTH: like apply-config.yml, this writes to OTHER repos, which the default GITHUB_TOKEN can't.
# It mints an installation token from a DEDICATED Renovate GitHub App (client ID in the
# RENOVATE_CLIENT_ID variable, key in the RENOVATE_APP_PRIVATE_KEY secret) — NOT the fleet CI
# App. That split is the point: the CI App is a bypass actor on the branch rulesets (it cuts
# releases), so a Renovate merge made as the CI App was gated only by Renovate's own status
# check. The Renovate App is on NO ruleset's bypass list, so with automerge + platformAutomerge
# off, Renovate merges its own PRs and GitHub still enforces the required CI checks on it.
# actions/create-github-app-token auto-revokes the token at job end. The token is SCOPED to
# exactly the fleet (`repositories:` derived from config/*.yml, same set apply-config
# reconciles), so it is the hard boundary on which repos Renovate can touch: a repo the App
# happens to be installed on but that ISN'T in config/ is unreachable. Renovate's
# `autodiscover` then simply enumerates the repos that scoped token can see.
# (Fail-closed: if config/ lists a repo the Renovate App is NOT installed on, the token mint
# 422s and the whole run fails — install the App on a managed repo before adding it to config/.)
#
#   The App must hold, and the token requests, Renovate's documented GitHub App set:
#     - Contents: write        — open branches / commit dependency bumps
#     - Pull requests: write   — open, update, and merge the PRs
#     - Workflows: write       — Renovate edits files under .github/workflows/**
#     - Issues: write          — the dependency dashboard issue + PR labels
#     - Commit statuses: write — minimumReleaseAge's renovate/stability-days status. Without
#                                it Renovate reports "Repository has changed during renovation"
#                                and abandons the repo while the workflow stays green.
#     - Checks: write          — read the CI check runs it gates automerge on
#     - Administration: read   — read branch protection / rulesets
#
# SAFE UNTIL CONFIGURED: a preflight reports whether RENOVATE_CLIENT_ID + RENOVATE_APP_PRIVATE_KEY are
# present; every step gates on it, so the workflow SKIPS cleanly (green, no writes) until the
# App is wired up. First-run safety: dispatch manually with dryRun=true to log the discovered
# scope and proposed changes WITHOUT opening any PRs.

name: renovate-fleet

on:
  schedule:
    # Daily. Renovate is the freshness *ceiling* only — Dependabot owns the fast security
    # *floor* (repo-management#144), so Renovate is off the critical path and no longer needs a
    # tight cadence. Its minimumReleaseAge hold already delays merges by days, so a daily sweep
    # changes runner cost / PR-noise, not when anything actually lands. The concurrency guard
    # below still serializes runs; Renovate's own scheduling/limits govern PR cadence beyond this.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run — discover repos and log proposed changes without opening/updating PRs."
        type: boolean
        default: false
      logLevel:
        description: "Renovate log verbosity."
        type: choice
        default: "info"
        options: ["debug", "info", "warn"]

permissions:
  contents: read

# One fleet run at a time; never cancel an in-flight run (it may be mid-push to a repo).
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Cheap fast-skip when the Renovate App's client ID isn't set at all.
    if: vars.RENOVATE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      # A secret can't be read in a job-level `if:`, so require the private key here too: if
      # RENOVATE_CLIENT_ID is set but RENOVATE_APP_PRIVATE_KEY isn't, skip cleanly (green run)
      # instead of failing at token mint. Matches apply-config.yml.
      - name: Preflight — App fully configured?
        id: preflight
        env:
          RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$RENOVATE_APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Renovate skipped — RENOVATE_CLIENT_ID is set but RENOVATE_APP_PRIVATE_KEY is missing."
          fi

      # Checked out so we can read config/ to derive the scoped token's fleet repo set, and so
      # the Renovate action can read the global config file from the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.preflight.outputs.enabled == 'true'
        with:
          # Read-only checkout — all writes use the App token via the API, not git (zizmor artipacked).
          persist-credentials: false

      - name: Set up uv (+ managed Python)
        if: steps.preflight.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Derive the fleet repo set from config (for the scoped token)
        id: fleet
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # The fleet is the union of repos: across config/*.yml — the same set apply-config
          # reconciles. Scoping the token to exactly these names is what bounds Renovate to the
          # fleet (and excludes a stray installed repo like cxxserv/cxxtests).
          names="$(uv run repo-management list-repos --format names)"
          echo "names=${names}" >>"$GITHUB_OUTPUT"
          echo "::notice::Renovate token scoped to fleet repos: ${names}"

      - name: Enable dry-run (manual dispatch only)
        # Set RENOVATE_DRY_RUN only when explicitly requested, so scheduled runs are live and we
        # never feed Renovate an empty/invalid dryRun value. Gate on the event explicitly so the
        # boolean `inputs.dryRun` is only read on workflow_dispatch (on schedule it is null).
        if: steps.preflight.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.dryRun
        run: echo "RENOVATE_DRY_RUN=full" >>"$GITHUB_ENV"

      - name: Mint an installation token scoped to the fleet
        id: app-token
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Scope the token to exactly the fleet (owner defaults to this repo's owner). This is
          # the security boundary — least-privilege on the repo axis, like apply-config.yml.
          repositories: ${{ steps.fleet.outputs.names }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
          permission-statuses: write
          permission-checks: write
          permission-administration: read

      - name: Skip repos that run Renovate themselves
        id: remaining
        if: steps.preflight.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          NAMES: ${{ steps.fleet.outputs.names }}
        run: |
          set -euo pipefail
          remaining=()
          IFS=, read -ra all <<<"$NAMES"
          for r in "${all[@]}"; do
            caller="$(gh api "repos/$OWNER/$r/contents/.github/workflows/renovate.yml" --jq .content 2>/dev/null | base64 -d || true)"
            if grep -q 'reusable-renovate\.yml' <<<"$caller"; then
              echo "::notice::$r runs its own Renovate; skipped here"
            else
              remaining+=("$OWNER/$r")
            fi
          done
          # An empty autodiscoverFilter would mean "no filter", so an empty list must skip the run.
          echo "count=${#remaining[@]}" >>"$GITHUB_OUTPUT"
          echo "filter=$(printf '%s\n' "${remaining[@]+"${remaining[@]}"}" | jq -Rnc '[inputs | select(length > 0)]')" >>"$GITHUB_OUTPUT"

      - name: Run Renovate across the fleet
        if: steps.preflight.outputs.enabled == 'true' && steps.remaining.outputs.count != '0'
        uses: renovatebot/github-action@dd5302ec17783b2fc721b19ae7209b57b1587765 # v46.1.17
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ steps.remaining.outputs.filter }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate-global.json
