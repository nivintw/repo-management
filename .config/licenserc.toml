# hawkeye (https://github.com/fast/hawkeye) — inserts & maintains SPDX license headers for
# REUSE compliance. Run: `hawkeye format` (or `check`). Header text is templated from [props]
# so year/holder/license live in one place. Only files with no usable comment syntax stay in
# REUSE.toml (strict JSON, lockfiles).

[header]
# REUSE-IgnoreStart — this template literally contains an SPDX-License-Identifier line;
# without the guard, `reuse lint` tries to parse the placeholder as a license.
text = """
SPDX-FileCopyrightText: © {{ props.inception_year }} {{ props.copyright_holder }}
SPDX-License-Identifier: {{ props.spdx_license_identifier }}
"""
# REUSE-IgnoreEnd
keywords = ["SPDX-"]

[files]
# Scan from where hawkeye is invoked (the repo root); the default would be this config's dir.
root = "{{ cwd }}"
excludes = [
  "LICENSE",
  "LICENSES/**",
  "uv.lock",
  "**/*.json",
  "**/.python-version",
  "**/.vscode/*",
  # CODEOWNERS has no extension hawkeye maps; it carries its own `#` header (reuse-verified).
  "**/CODEOWNERS",
  # GitHub's issue-form parser silently rejects a form whose YAML begins with a comment (it
  # falls back to a blank issue), so ISSUE_TEMPLATE/*.yml must start with the form keys and
  # can't carry an inline SPDX header — excluded here and licensed via REUSE.toml instead.
  ".github/ISSUE_TEMPLATE/**",
  # The Claude Code guard hooks ship verbatim from the template (no per-file templating), so
  # they carry no inline header — excluded here and licensed via REUSE.toml instead.
  ".claude/hooks/**",
  # Licensed via REUSE.toml instead of an inline header.
  "**/.gitignore",
  "docs/assets/favicon.svg",
]

[git]
ignore = "auto"

[props]
inception_year = 2026
spdx_license_identifier = "MIT"
copyright_holder = "Tyler Nivin"

[[rules]]
extensions = ["md"]
style_out = "xml"

# '#'-comment files hawkeye doesn't map by default.
[[rules]]
extensions = ["txt", "fish", "bats"]
filenames = [".envrc"]
style_out = "script"
